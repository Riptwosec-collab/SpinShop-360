name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair-eslint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      repaired: ${{ steps.marker.outputs.run }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check one-time repair marker
        id: marker
        run: |
          if [ -f .github/eslint-repair-marker ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.marker.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install compatible ESLint
        if: steps.marker.outputs.run == 'true'
        run: |
          npm install --save-dev --save-exact eslint@9.39.5
          npm audit --omit=dev --audit-level=high
          npm run lint

      - name: Commit repaired lockfile
        if: steps.marker.outputs.run == 'true'
        run: |
          rm .github/eslint-repair-marker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.head_ref }}"
          git checkout "origin/${{ github.head_ref }}" -- .github/workflows/ci.yml
          git add -A -- package.json package-lock.json .github/eslint-repair-marker
          git commit -m "use ESLint 9 for Next.js compatibility"
          git rebase "origin/${{ github.head_ref }}"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    needs: repair-eslint
    if: always() && needs.repair-eslint.outputs.repaired != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_USE_MOCK_DATA: "true"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      CHECKOUT_SIGNING_SECRET: "ci-only-signing-secret-not-used-in-production"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
