name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  upgrade-next:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      upgraded: ${{ steps.marker.outputs.run }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check one-time upgrade marker
        id: marker
        run: |
          if [ -f .github/workflows/next-upgrade-once.yml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.marker.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve a clean Next.js 16 dependency graph
        if: steps.marker.outputs.run == 'true'
        run: |
          REACT_VERSION="$(npm view react version)"
          REACT_DOM_VERSION="$(npm view react-dom version)"
          FIBER_VERSION="$(npm view @react-three/fiber version)"
          DREI_VERSION="$(npm view @react-three/drei version)"
          ESLINT_VERSION="$(npm view eslint version)"
          REACT_TYPES_VERSION="$(npm view @types/react version)"
          REACT_DOM_TYPES_VERSION="$(npm view @types/react-dom version)"
          POSTCSS_VERSION="$(npm view postcss version)"
          SHARP_VERSION="$(npm view sharp version)"

          npm pkg set \
            "dependencies.next=16.2.12" \
            "dependencies.react=${REACT_VERSION}" \
            "dependencies.react-dom=${REACT_DOM_VERSION}" \
            "dependencies.@react-three/fiber=${FIBER_VERSION}" \
            "dependencies.@react-three/drei=${DREI_VERSION}" \
            "devDependencies.eslint=${ESLINT_VERSION}" \
            "devDependencies.eslint-config-next=16.2.12" \
            "devDependencies.@types/react=${REACT_TYPES_VERSION}" \
            "devDependencies.@types/react-dom=${REACT_DOM_TYPES_VERSION}" \
            "devDependencies.postcss=${POSTCSS_VERSION}" \
            "overrides.postcss=${POSTCSS_VERSION}" \
            "overrides.sharp=${SHARP_VERSION}" \
            "scripts.lint=eslint ."

          rm -f package-lock.json
          npm install

      - name: Create Next.js 16 ESLint flat config
        if: steps.marker.outputs.run == 'true'
        run: |
          rm -f .eslintrc.json
          cat > eslint.config.mjs <<'EOF'
          import { defineConfig, globalIgnores } from "eslint/config";
          import nextVitals from "eslint-config-next/core-web-vitals";
          import nextTs from "eslint-config-next/typescript";

          export default defineConfig([
            ...nextVitals,
            ...nextTs,
            globalIgnores([
              ".next/**",
              "out/**",
              "build/**",
              "next-env.d.ts",
            ]),
            {
              rules: {
                "@next/next/no-img-element": "warn",
              },
            },
          ]);
          EOF

      - name: Verify upgraded production dependencies
        if: steps.marker.outputs.run == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Commit generated dependency files
        if: steps.marker.outputs.run == 'true'
        run: |
          rm .github/workflows/next-upgrade-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Refresh the workflow from the current remote branch so this generated
          # commit never overwrites a newer CI definition pushed while the job ran.
          git fetch origin "${{ github.head_ref }}"
          git checkout "origin/${{ github.head_ref }}" -- .github/workflows/ci.yml

          git add -A -- \
            package.json \
            package-lock.json \
            eslint.config.mjs \
            .eslintrc.json \
            .github/workflows/next-upgrade-once.yml
          git commit -m "upgrade Next.js and React dependencies"
          git rebase "origin/${{ github.head_ref }}"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    needs: upgrade-next
    if: always() && needs.upgrade-next.outputs.upgraded != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_USE_MOCK_DATA: "true"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      CHECKOUT_SIGNING_SECRET: "ci-only-signing-secret-not-used-in-production"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
